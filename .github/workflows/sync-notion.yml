name: "Sync Notion  Repo"

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC (台北 10:00)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Notion sync
        if: ${{ secrets.NOTION_TOKEN && (secrets.NOTION_PAGE_ID || secrets.NOTION_DATABASE_ID) }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          set -euxo pipefail
          node scripts/sync-notion.js

      - name: Skip Notion sync (no secrets)
        if: ${{ ! (secrets.NOTION_TOKEN && (secrets.NOTION_PAGE_ID || secrets.NOTION_DATABASE_ID)) }}
        run: echo "Skipping Notion sync: missing NOTION_TOKEN and NOTION_PAGE_ID/NOTION_DATABASE_ID"

      - name: Commit and push changes
        run: |
          git config user.name "${{ secrets.COMMIT_NAME || 'notion-sync-bot' }}"
          git config user.email "${{ secrets.COMMIT_EMAIL || 'notion-sync-bot@example.com' }}"
          git add notion-content || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync Notion content: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
