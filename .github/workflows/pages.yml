name: Deploy Markdown to GitHub Pages

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure docs directory
        run: |
          mkdir -p docs

      - name: Copy root markdown to docs (use root source file)
        run: |
          cp "【mo co】Neo 新版季末純粹 DPS 武器強度排行與新手避坑指南（結合 Cellstring  3d6dedc0cd24805fa09edfb794d03262.md" docs/neo-dps-cellstring.md || true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown

      - name: Convert markdown to HTML
        run: |
          python scripts/convert_md.py "docs/neo-dps-cellstring.md" build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
